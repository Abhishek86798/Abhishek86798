  <text x="74" y="224" fill="#e6edf3" font-size="17">spark-submit stream_processor/aggregate.py</text>
  <text x="74" y="250" fill="#3fb950" font-size="16">ok</text>
  <text x="104" y="250" fill="#8b949e" font-size="16">gridpulse · 42 meters · 19 buildings · sub-minute latency</text>
  <text x="48" y="276" fill="#3fb950" font-size="17">$</text>
  <text x="74" y="276" fill="#e6edf3" font-size="17">mcp-ztgateway</text>
