<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1b2430"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" rx="14" fill="#0d1117"/>
  <rect width="1000" height="300" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="none" stroke="#1f2733"/>

  <!-- title bar -->
  <circle cx="34" cy="34" r="6" fill="#30363d"/>
  <circle cx="54" cy="34" r="6" fill="#30363d"/>
  <circle cx="74" cy="34" r="6" fill="#30363d"/>
  <text x="104" y="39" fill="#6e7681" font-size="14">~/abhishek · zsh</text>
  <text x="966" y="39" fill="#6e7681" font-size="14" text-anchor="end">identity</text>

  <!-- name -->
  <text x="48" y="132" fill="#e6edf3" font-size="54" font-weight="700" letter-spacing="1">abhishek kokadwar</text>
  <text x="52" y="164" fill="#8b949e" font-size="17" letter-spacing="2">data pipelines · backend · the boundaries between systems</text>

  <line x1="48" y1="190" x2="952" y2="190" stroke="#1f2733"/>
  <line x1="620" y1="190" x2="820" y2="190" stroke="url(#accent)" stroke-width="2"/>

  <!-- terminal lines -->
